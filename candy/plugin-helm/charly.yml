plugin-helm:
    candy:
        description: |-
            OUT-OF-TREE charly plugin owning the helm words (Factory Unit 1): the
            `step:helm-release` install step (a plugin-contributed `external:helm-release`
            install-step KIND, F3 — its OPAQUE Payload is the #HelmReleaseStep def, carried
            through the InstallPlan IR and validated against this plugin's served schema at
            authoring; the step performs the `helm upgrade --install` invocation IN-VENUE
            against the venue's kubeconfig — /etc/rancher/k3s/k3s.yaml on a k3s guest — and
            returns a teardown ReverseOp `helm uninstall` the host records + replays) and
            the `verb:helm` check verb (the declarative release-status assertion, the
            `verb:kube` analog: method + method-exclusive modifiers ride the desugared
            plugin input, validated against #HelmInput; EXEC-based like wl/dbus — it drives
            the venue's helm binary over the host's live DeployExecutor reverse channel,
            owning NO Kubernetes client library). A standalone Go module (go.mod + main.go)
            served OUT-OF-PROCESS over go-plugin gRPC via the charly plugin SDK
            (github.com/opencharly/sdk). The R10 consumer is the check-helm bed (a
            disposable `vm:` + `k3s-server` + `kubernetes` composition that installs a real
            chart via `step:helm-release` and asserts it deployed via `verb:helm`).
        plugin:
            providers:
                - step:helm-release
                - verb:helm
            source: github.com/opencharly/plugin-helm/candy/plugin-helm
            primary:
                helm: method
        plan:
            # The plugin's own ADE self-test is a build-context trivial step (the
            # examplestepkind precedent): the verb's real dispatch + the step's real
            # install are carried by the check-helm R10 bed, which composes this plugin
            # against a live k3s cluster — no release exists on a disposable `charly
            # check box`, so no `helm:` assertion can be deterministic here.
            - check: the out-of-tree helm plugin ships a buildable Go module the host can build + serve out-of-process
              id: helm-module-present
              context:
                - build
              command: "true"

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
helm-skill:
  skill:
    name: helm
    family: kubernetes
    owner: plugin-helm
    triggers:
      - "`step:helm-release` / `verb:helm` / installing a Helm chart from a candy plan / the `helm_charts:` deploy field and its kustomize `helmCharts:` emission / the `--enable-helm` apply path"
